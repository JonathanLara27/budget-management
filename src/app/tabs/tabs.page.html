<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button [routerLink]="['/tabs/dashboard']" routerLinkActive="tab-selected" 
    [routerLinkActiveOptions]="{ exact: true }">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label>Resumen</ion-label>
    </ion-tab-button>

    <ion-tab-button [routerLink]="['/tabs/transactions']" routerLinkActive="tab-selected" 
    [routerLinkActiveOptions]="{ exact: true }">
      <ion-icon name="list-outline"></ion-icon>
      <ion-label>Historial</ion-label>
    </ion-tab-button>

    <ion-tab-button [routerLink]="['/tabs/add']" routerLinkActive="tab-selected" 
    [routerLinkActiveOptions]="{ exact: true }">
      <ion-icon name="add-circle-outline"></ion-icon>
      <ion-label>Agregar</ion-label>
    </ion-tab-button>

    <ion-tab-button [routerLink]="['/tabs/profile']" routerLinkActive="tab-selected" 
    [routerLinkActiveOptions]="{ exact: true }">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
