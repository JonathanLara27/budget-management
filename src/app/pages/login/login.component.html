<ion-content>
  <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">
    <div class="email">
      <ion-input type="email" label="Email" label-placement="floating" formControlName="email" [clearInput]="true"></ion-input>
    </div>
    <div class="password">
      <ion-input type="password" label="Password" label-placement="floating" formControlName="password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </div>
    <div class="submit">
      <ion-button type="submit" [disabled]="loginForm.invalid">Login</ion-button>
    </div>
  </form>
<ion-toast [isOpen]="!!messageLoginError()" [message]="messageLoginError()" [duration]="durationToast()" color="danger">
</ion-toast>


</ion-content>
