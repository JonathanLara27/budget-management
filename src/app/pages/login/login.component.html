<ion-content class="login-content" fullscreen>
  <div class="login-wrapper">
    <div class="login-container">
      <h1 class="app-title">Budget Management</h1>

      <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="login-form">
        <ion-input type="email" label="Correo electrónico" label-placement="floating" formControlName="email"
          [clearInput]="true"></ion-input>

        <ion-input type="password" label="Contraseña" label-placement="floating" formControlName="password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>

        <ion-button expand="block" type="submit" [disabled]="loginForm.invalid" class="submit-button">
          Iniciar sesión
        </ion-button>
      </form>

    <div class="extra-buttons">
      <ion-button expand="block" fill="outline" color="medium" (click)="onLoginWithGoogle()">
        <ion-icon slot="start" name="logo-google"></ion-icon>
        Login con Google
      </ion-button>
      <ion-button expand="block" fill="outline" color="secondary" (click)="onRegister()">
        Registrarse
      </ion-button>
    </div>
    <div class="forgot-password">
      <a (click)="onForgotPassword()">¿Olvidaste tu contraseña?</a>
    </div>
    </div>
  </div>

  <ion-toast [isOpen]="!!messageLoginError()" [message]="messageLoginError()" [duration]="durationToast()"
    color="danger">
  </ion-toast>
</ion-content>
