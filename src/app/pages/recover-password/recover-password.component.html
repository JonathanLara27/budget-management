<ion-content class="recover-content" fullscreen>
    <div class="recover-wrapper">
        <div class="recover-container">
            <h1 class="app-title">{{appTitle()}} </h1>

            <form (ngSubmit)="onSubmit()" [formGroup]="recoverForm" class="recover-form">
                <ion-input type="email" label="Correo electrónico" label-placement="floating" formControlName="email"
                    [clearInput]="true"></ion-input>
                    <ion-button type="submit" expand="block" (click)="onSubmit()">
                        {{buttonLabelRecover()}}
                    </ion-button>
            </form>

            <div class="extra-buttons">
                <ion-button expand="block" fill="outline" color="secondary" (click)="onBack()">
                    {{buttonLaberBack()}}
                </ion-button>
            </div>
        </div>
    </div>

    <ion-toast [isOpen]="!!error()" [message]="error()" [duration]="durationToast()"
        color="danger">
    </ion-toast>
    <ion-toast [isOpen]="!!success()" [message]="success()" [duration]="durationToast()"
        color="success">
    </ion-toast>
</ion-content>
